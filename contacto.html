<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Preparatoria La Salle Torreón</title>
    <link rel="icon" href="./icon.png" type="image/png" sizes="32x32">    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./navbar.css">
    <link rel="stylesheet" href="./footer.css">
    <style>
:root {
    --lasalle-navy: #002B49;
    --lasalle-blue: #005596;
    --lasalle-gold: #EAAA00;
    --lasalle-gold-light: #FFF3CD;
    --lasalle-gray-bg: #F8FAFC;
    --lasalle-card-border: #E2E8F0;
    --text-main: #1E293B;
    --text-muted: #64748B;
    --nav-h: 30px; 
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    background-color: var(--lasalle-gray-bg);
    color: var(--text-main);
    line-height: 1.6;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
}

/* --- HERO BANNER DE CONTACTO (Mismo estilo que .admisiones) --- */
.contacto-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 3rem 1.5rem;
    background: linear-gradient(135deg, var(--lasalle-navy) 0%, var(--lasalle-blue) 100%);
    min-height: 35vh;
    margin-top: var(--nav-h);
    text-align: center;
    position: relative;
    box-shadow: 0 10px 25px -5px rgba(0, 43, 73, 0.25);
    border-bottom: 4px solid var(--lasalle-gold);
    width: 100%;
}

.contacto-header h1 {
    color: #ffffff;
    font-size: clamp(2rem, 5vw, 3.2rem);
    font-weight: 800;
    margin-bottom: 0.75rem;
    letter-spacing: -0.5px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.2);
}

.contacto-header p {
    color: #E2E8F0;
    font-size: clamp(1rem, 2.5vw, 1.3rem);
    max-width: 650px;
    font-weight: 300;
}

/* --- SECCIÓN PRINCIPAL DE CONTENIDO DE CONTACTO --- */
.contacto {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 3.5rem 1.5rem;
    flex: 1 0 auto;
}

.contacto-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 2rem;
    align-items: stretch;
}

/* Tarjeta con Información y Formulario */
.contacto-info {
    background: #ffffff;
    padding: 2rem;
    border-radius: 16px;
    box-shadow: 0 10px 25px -5px rgba(0, 43, 73, 0.08);
    border: 1px solid var(--lasalle-card-border);
    border-top: 5px solid var(--lasalle-navy);
}

.contacto-info h3 {
    color: var(--lasalle-navy);
    margin-top: 0;
    margin-bottom: 1.25rem;
    font-size: 1.4rem;
    font-weight: 700;
    position: relative;
    padding-bottom: 0.5rem;
}

.contacto-info h3::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: 0;
    width: 35px;
    height: 3px;
    background-color: var(--lasalle-gold);
    border-radius: 2px;
}

.info-lista {
    list-style: none;
    padding: 0;
    margin: 0 0 1.5rem 0;
}

.info-lista li {
    margin-bottom: 0.9rem;
    color: var(--text-main);
    display: flex;
    align-items: center;
    gap: 0.8rem;
    font-size: 0.95rem;
}

.info-lista i {
    color: var(--lasalle-gold);
    font-size: 1.1rem;
    width: 20px;
    text-align: center;
}

/* Formulario */
.contacto-form {
    display: flex;
    flex-direction: column;
    gap: 1rem;
}

.contacto-form input,
.contacto-form textarea {
    width: 100%;
    padding: 0.8rem 1rem;
    border: 1px solid var(--lasalle-card-border);
    border-radius: 8px;
    font-size: 0.95rem;
    outline: none;
    background-color: var(--lasalle-gray-bg);
    color: var(--text-main);
    transition: all 0.3s ease;
}

.contacto-form input:focus,
.contacto-form textarea:focus {
    border-color: var(--lasalle-blue);
    background-color: #ffffff;
    box-shadow: 0 0 0 3px rgba(0, 85, 150, 0.15);
}

.contacto-form button {
    background: var(--lasalle-navy);
    color: #ffffff;
    padding: 0.9rem;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.3s ease, transform 0.2s ease;
}

.contacto-form button:hover {
    background: var(--lasalle-blue);
    transform: translateY(-2px);
}

/* Contenedor del Mapa */
.mapa-wrapper {
    width: 100%;
    height: 100%;
    min-height: 400px;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 25px -5px rgba(0, 43, 73, 0.08);
    border: 1px solid var(--lasalle-card-border);
}

.mapa-wrapper iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
}
    </style>
</head>
    <header id="main-header"></header>

<body>
<header id="main-header"></header>

<div class="contacto-header">
    <h1>Contacto</h1>
    <p>Estamos para atenderte. Ponte en contacto con la Preparatoria La Salle Torreón.</p>
</div>

<main class="contacto">
    <div class="contacto-grid">
        <div class="contacto-info">
            <h3>Escríbenos</h3>
            <ul class="info-lista">
                <li><i class="fa-solid fa-location-dot"></i> Av. Universidad 123, Torreón, Coahuila</li>
                <li><i class="fa-solid fa-phone"></i> +52 123 456 7890</li>
                <li><i class="fa-solid fa-envelope"></i> info@lasalle.edu.mx</li>
            </ul>

            <form class="contacto-form">
                <input type="text" placeholder="Nombre completo" required>
                <input type="email" placeholder="Correo electrónico" required>
                <textarea rows="4" placeholder="¿En qué podemos ayudarte?" required></textarea>
                <button type="submit">Enviar Mensaje</button>
            </form>
        </div>

        <div class="mapa-wrapper">
        <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1272.664393147701!2d-103.46748824820392!3d25.550416190271115!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x868fd976b0c133c1%3A0x5e6022a5ae6c20f7!2sUniversidad%20La%20Salle%20Laguna!5e0!3m2!1ses-419!2smx!4v1790704953581!5m2!1ses-419!2smx"
            title="Ubicación de Universidad La Salle Laguna"
            allowfullscreen
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade">
        </iframe>        
    </div>
    </div>
</main>

<footer id="main-footer"></footer>
 

    <!-- 1. SCRIPT PARA EL MENÚ RESPONSIVO (NAVBAR) -->
    <script src="navbar.js"></script>
    <script src="./footer.js"></script>
    <script src="./navbar.js"></script>
</body>
</html>
